name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. A running deploy is never cancelled mid-flight
# (that can leave Pages half-applied); runs queued behind it are superseded.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The site moved to 0-draft/aws-connectivity on 2026-11-08. Pages now
      # serves only a redirect (redirect/) to its new home, keeping ?lang=
      # and the #section of old links.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job needs to publish; the build job runs third-party install
    # scripts and should not hold an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
